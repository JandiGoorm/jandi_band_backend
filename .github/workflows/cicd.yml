name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '29 18 * * 0'

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test in Docker
        run: docker build --target test .
      - name: Build runtime in Docker
        env:
          EVENT: ${{ github.event_name }}
        run: |
          options=()
          if [[ $EVENT == schedule ]]; then options+=(--no-cache-filter runtime); fi
          docker buildx build --load --pull "${options[@]}" --target runtime -t oci-candidate:test .
      - name: Verify startup evidence survives container replacement
        run: bash scripts/test-startup-diagnostics.sh oci-candidate:test
      - uses: ./.github/actions/scan-image
        with:
          image: oci-candidate:test
          platform: linux/amd64
          report: candidate-jandi-band

  verify-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve declared gateway image
        id: gateway
        run: |
          image=$(docker compose -f gateway/compose.yaml config --images)
          [[ $image =~ ^ghcr\.io/kyj0503/backtest-console:[0-9]+\.[0-9]+\.[0-9]+-gateway-alpine@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.gateway.outputs.image }}
          platform: linux/amd64
          report: gateway-candidate-spring

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/jandigoorm/jandi-band@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          pull: true
          no-cache-filters: ${{ github.event_name == 'schedule' && 'runtime' || '' }}
          push: true
          tags: |
            ghcr.io/jandigoorm/jandi-band:${{ github.ref_name }}
            ghcr.io/jandigoorm/jandi-band:${{ github.ref_name }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=runtime-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=runtime-${{ github.ref_name }}

  scan-published:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ needs.publish.outputs.image }}
          platform: linux/amd64
          report: published-jandi-band

  deploy:
    needs: [publish, scan-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://rhythmeet-be.yeonjae.kr/actuator/health
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Connect to OCI through Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:jandi-ci
          version: '1.104.2'
          sha256sum: 512f613ed7d04fc7282f7dc5bd76aa105aae28168fbb9357eb749ebcbc29f0ae
          args: --accept-dns=false
          retry: '1'
          ping: ${{ vars.OCI_HOST }}
      - name: Disable runner subnet route acceptance
        run: sudo tailscale set --accept-routes=false
      - name: Deploy exact image digest
        env:
          APP_IMAGE: ${{ needs.publish.outputs.image }}
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy.py
