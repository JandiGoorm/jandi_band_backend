name: Scan running OCI image
on:
  schedule:
    - cron: '29 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.container.outputs.image }}
      gateway: ${{ steps.container.outputs.gateway }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Connect to OCI through Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_CVE_CLIENT_ID }}
          audience: ${{ vars.TS_CVE_AUDIENCE }}
          tags: tag:jandi-ci
          version: '1.104.2'
          sha256sum: 512f613ed7d04fc7282f7dc5bd76aa105aae28168fbb9357eb749ebcbc29f0ae
          args: --accept-dns=false
          retry: '1'
          ping: ${{ vars.OCI_HOST }}
      - name: Disable runner subnet route acceptance
        run: sudo tailscale set --accept-routes=false
      - name: Read running image digest
        id: container
        env:
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          image=$(bash scripts/running-image.sh jandi-band ghcr.io/jandigoorm/jandi-band)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          gateway=$(bash scripts/running-image.sh nginx-gateway nginx)
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"

  scan:
    permissions:
      contents: read
      packages: read
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ needs.inventory.outputs.image }}
          platform: linux/amd64
          report: running-jandi-band

  scan-gateway:
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/scan-image
        with:
          image: ${{ needs.inventory.outputs.gateway }}
          platform: linux/amd64
          report: running-gateway-spring
