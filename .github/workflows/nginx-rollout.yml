name: Roll out host Nginx
on:
  schedule:
    - cron: '20 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['gateway/**', '.github/workflows/nginx-rollout.yml']

permissions:
  contents: read

concurrency:
  group: production-gateway
  cancel-in-progress: false

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.pin.outputs.image }}
      ready: ${{ steps.pin.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=$(docker compose -f gateway/compose.yaml config --images)
          [[ $image =~ ^ghcr\.io/kyj0503/backtest-console:[0-9]+\.[0-9]+\.[0-9]+-gateway-alpine@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # Only a successful main-branch rollout can publish this receipt.
          api=https://api.github.com/repos/JandiGoorm/jandi_band_py/actions
          get() {
            curl --fail-with-body --silent --show-error --retry 3 --max-time 20 \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$1"
          }
          run=$(get "$api/workflows/nginx-rollout.yml/runs?branch=main&status=completed&per_page=10" | jq -r '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch" or .event == "push")][0] | select(.conclusion == "success") | .id // empty')
          ready=false
          if [[ -n $run ]]; then
            ready=$(get "$api/runs/$run/artifacts" | jq -r --arg name "healthy-${image##*:}" 'any(.artifacts[]; .name == $name and (.expired | not))')
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "Preceding host has verified this digest: $ready" >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/scan-image
        if: steps.pin.outputs.ready == 'true'
        with:
          image: ${{ steps.pin.outputs.image }}
          platform: linux/amd64
          report: nginx-rollout-spring

  deploy:
    needs: candidate
    if: needs.candidate.outputs.ready == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Connect to OCI through Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ vars.TS_NGINX_CLIENT_ID }}
          audience: ${{ vars.TS_NGINX_AUDIENCE }}
          tags: tag:jandi-ci
          version: '1.104.2'
          sha256sum: 512f613ed7d04fc7282f7dc5bd76aa105aae28168fbb9357eb749ebcbc29f0ae
          args: --accept-dns=false
          retry: '1'
          ping: ${{ vars.OCI_HOST }}
      - name: Disable runner subnet route acceptance
        run: sudo tailscale set --accept-routes=false
      - name: Deploy and verify host HTTPS
        id: deployed
        env:
          IMAGE: ${{ needs.candidate.outputs.image }}
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          [[ $IMAGE =~ ^ghcr\.io/kyj0503/backtest-console:[0-9]+\.[0-9]+\.[0-9]+-gateway-alpine@sha256:[0-9a-f]{64}$ ]]
          bash scripts/oci-ssh.sh "python3 - $IMAGE" < gateway/deploy.py
          echo "$IMAGE" > "$RUNNER_TEMP/gateway-healthy.txt"
          echo "digest=${IMAGE##*:}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: healthy-${{ steps.deployed.outputs.digest }}
          path: ${{ runner.temp }}/gateway-healthy.txt
          retention-days: 14
