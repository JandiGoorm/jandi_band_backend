version: 2
updates:
  - package-ecosystem: "gradle"
    target-branch: main
    directory: "/"
    schedule:
      interval: daily
    groups:
      package-patches:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: "docker"
    target-branch: main
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: "docker-compose"
    target-branch: main
    directory: "/gateway"
    schedule:
      interval: daily
  - package-ecosystem: "github-actions"
    target-branch: main
    directory: "/"
    schedule:
      interval: daily
