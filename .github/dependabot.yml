version: 2
updates:
  - package-ecosystem: "gradle"
    target-branch: main
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      spring-platform:
        patterns: ["org.springframework*", "io.spring*", "org.springdoc:*"]
        update-types: ["minor", "major"]
      object-storage:
        patterns: ["software.amazon.awssdk:*", "com.twelvemonkeys.imageio:*"]
        update-types: ["minor", "major"]
      authentication:
        patterns: ["io.jsonwebtoken:*", "commons-codec:*"]
        update-types: ["minor", "major"]
      observability:
        patterns: ["io.micrometer:*", "io.prometheus:*", "net.logstash.logback:*"]
        update-types: ["minor", "major"]
      test-tools:
        patterns: ["org.junit*", "org.assertj:*", "com.squareup.okhttp3:*", "com.h2database:*"]
        update-types: ["minor", "major"]
      package-patches:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: "docker"
    target-branch: main
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      runtime-images:
        patterns: ["*"]
        update-types: ["minor", "major"]
  - package-ecosystem: "docker-compose"
    target-branch: main
    directory: "/gateway"
    schedule:
      interval: quarterly
    groups:
      gateway-images:
        patterns: ["ghcr.io/kyj0503/backtest-console"]
        update-types: ["minor", "major"]
  - package-ecosystem: "github-actions"
    target-branch: main
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      ci-actions:
        patterns: ["*"]
        update-types: ["minor", "major"]
