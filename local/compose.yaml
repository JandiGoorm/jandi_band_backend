name: rhythmeet-local
services:
  mysql:
    image: mysql:innovation@sha256:f51c9c01c16b0eb5d81bb70ab7e7fcb3b96abc6a54114be3a94e8e569cae7815
    command: [--skip-log-bin]
    environment:
      MYSQL_ROOT_PASSWORD: local-root-only
      MYSQL_DATABASE: rhythmeet_local
      MYSQL_USER: rhythmeet_local
      MYSQL_PASSWORD: local-db-only
    volumes:
      - mysql-data:/var/lib/mysql
      - ../database/local/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../database/local/002_mock_data.sql:/docker-entrypoint-initdb.d/002_mock_data.sql:ro
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, --silent]
      interval: 3s
      timeout: 3s
      retries: 40
  backend:
    image: rhythmeet-local-backend:dev
    build:
      context: ..
      dockerfile: local/Dockerfile.backend
    init: true
    env_file:
      - path: ../.env.local
        format: raw
    environment:
      DB_URL: jdbc:mysql://mysql:3306/rhythmeet_local?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: rhythmeet_local
      DB_PASSWORD: local-db-only
      JWT_SECRET: LOCAL_DEVELOPMENT_ONLY_NOT_FOR_DEPLOYMENTS_32_BYTES
    volumes:
      - ../config:/app/config:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
  band-py:
    image: jandi-band-py:local
    build:
      context: ../../jandi_band_py
      target: runtime
    command: [uvicorn, app:app, --host, 0.0.0.0, --port, '8000', --reload]
    env_file:
      - path: ../../jandi_band_py/.env
        format: raw
    volumes:
      - ../../jandi_band_py/app.py:/app/app.py:ro
      - ../../jandi_band_py/service:/app/service:ro
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8000/health']
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    image: rhythmeet-local-frontend:dev
    build:
      context: ../../jandi_band_frontend
      dockerfile: ../jandi_band_backend/local/Dockerfile.frontend
    env_file:
      - path: ../../jandi_band_frontend/.env.local
        format: raw
    volumes:
      - ../../jandi_band_frontend:/app
      - frontend-node-modules:/app/node_modules
      - ./vite.config.mjs:/opt/vite.local.config.mjs:ro
    ports: ["127.0.0.1:3000:5173"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      backend:
        condition: service_healthy
volumes:
  mysql-data:
  frontend-node-modules:
