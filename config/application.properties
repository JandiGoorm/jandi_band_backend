spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jackson.time-zone=Asia/Seoul
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
jwt.secret=${JWT_SECRET}
jwt.access-token-validity=1800000
jwt.refresh-token-validity=604800000
jwt.refresh-token-reissue-threshold=86400000
kakao.rest-api-key=${KAKAO_REST_API_KEY}
kakao.redirect-url=https://jandirhythmeet.netlify.app/callback
kakao.logout-url=https://kauth.kakao.com/oauth/logout
kakao.token-url=https://kauth.kakao.com/oauth/token
kakao.user-info-url=https://kapi.kakao.com/v2/user/me
kakao.user-unlink-url=https://kapi.kakao.com/v1/user/unlink
kakao.admin-key=${KAKAO_ADMIN_KEY}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID}
cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false
cloud.aws.s3.bucket=jandi-rhythmeet
cloud.aws.s3.url=https://jandi-rhythmeet.s3.ap-northeast-2.amazonaws.com
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
spring.data.redis.host=redis-17498.c340.ap-northeast-2-1.ec2.cloud.redislabs.com
spring.data.redis.port=17498
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=30000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
invite.club.link.prefix=https://jandirhythmeet.netlify.app/invite/club/accept
invite.team.link.prefix=https://jandirhythmeet.netlify.app/invite/team/accept
invite.expire.days=7
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
user-withdraw.days=7
clubpending.expire.days=7
clubpending.expire.cron=0 0 0 * * ?
