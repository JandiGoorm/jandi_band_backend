plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.jandi'
version = '0.0.1-SNAPSHOT'

bootJar {
    archiveFileName = 'band_backend-0.0.1-SNAPSHOT.jar'
}

java {
    sourceCompatibility = '25'
    targetCompatibility = '25'
}

compileJava {
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.compilerArgs << '-parameters'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-logging'
    
    // Logstash encoder for structured JSON logging
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    // Prometheus & Grafana 모니터링
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-core'
    // Prometheus exposition formats
    implementation 'io.prometheus:prometheus-metrics-exposition-formats'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // MockWebServer for external API testing
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.5.1'
    
    // AssertJ for better assertions
    testImplementation 'org.assertj:assertj-core'
    
    // H2 Database for testing
    testImplementation 'com.h2database:h2'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'commons-codec:commons-codec'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // OCI Object Storage S3-compatible API
    implementation platform('software.amazon.awssdk:bom:2.57.3')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'

    // Swagger/OpenAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

// Test-only HTTP fixture classpath; excluded from the runtime JAR.
tasks.register('prepareStorageSmoke', Sync) {
    dependsOn testClasses
    from sourceSets.test.runtimeClasspath
    into layout.buildDirectory.dir('storage-smoke')
}

// JaCoCo 테스트 커버리지
jacoco {
    toolVersion = "0.8.15"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/*Application*',
                '**/*Config*',
                '**/dto/**',
                '**/entity/**',
                '**/exception/**',
                '**/constant/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.70 // 70% 커버리지 목표
            }
        }
    }
}

// 테스트 환경별 설정
test {
    systemProperty 'spring.profiles.active', 'test'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

springBoot {
    mainClass = 'com.jandi.band_backend.JandiBandBackendApplication'
}
